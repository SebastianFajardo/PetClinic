services:
  database:
    image: postgres:17-alpine
    container_name: petclinic-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petclinic}
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petclinic}
    ports:
      - "5432:5432"
    volumes:
      - petclinic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petclinic} -d ${POSTGRES_DB:-petclinic}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  petclinic_data:
